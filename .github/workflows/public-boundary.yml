name: Public Boundary Check

on:
  push:
  pull_request:

jobs:
  disclosure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject confidential implementation extensions
        run: |
          if find . -type f \( -name '*.mq4' -o -name '*.ex4' -o -name '*.mq5' -o -name '*.ex5' \) | grep -q .; then
            echo 'Confidential trading implementation file detected in public case study.'
            exit 1
          fi
      - name: Require disclosure documentation
        run: |
          test -f README.md
          test -f docs/disclosure-boundary.md
          test -f docs/project-closure.md
